NAME=Zypper
EMOJI=🦎
REQUIRES_CMD=zypper
PROBE_ACTIVE_CMD=[[ -d /var/lib/zypp ]]
PRIORITY=0
CHECK_CMD=zypper list-updates
UPDATE_CMD=sudo zypper --non-interactive-keys update
FLAGS=
FLAGS_AUTO_CONFIRM=--non-interactive
FLAGS_INTERACTIVE=
FLAGS_OVERRIDE=
COLOR_FLAG=
EXCLUDE_FLAG=
EXCLUDE_JOIN=
EXCLUDE_HOLD_CMD=sudo zypper addlock $PKG
EXCLUDE_UNHOLD_CMD=sudo zypper removelock $PKG
CHECK_UPDATES_EXIT_CODE=
CHECK_FILTER_PATTERN=^v\ \|
CHECK_TIMEOUT_FALLBACK=
ENABLED=true
