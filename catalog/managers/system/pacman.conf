NAME=Pacman
EMOJI=🖥️
REQUIRES_CMD=pacman
PROBE_ACTIVE_CMD=[[ -d /var/lib/pacman/local ]]
PRIORITY=0
CHECK_CMD=command -v checkupdates >/dev/null 2>&1 && checkupdates || pacman -Qu 2>/dev/null
UPDATE_CMD=sudo pacman -Syu
FLAGS=
FLAGS_AUTO_CONFIRM=--noconfirm
FLAGS_INTERACTIVE=
FLAGS_OVERRIDE=--overwrite '*'
COLOR_FLAG=--color=always
EXCLUDE_FLAG=--ignore
EXCLUDE_JOIN=,
EXCLUDE_HOLD_CMD=
EXCLUDE_UNHOLD_CMD=
CHECK_UPDATES_EXIT_CODE=
CHECK_FILTER_PATTERN=
CHECK_TIMEOUT_FALLBACK=$REQUIRES_CMD -Qu
CHECK_DEP_BIN=checkupdates
CHECK_DEP_INSTALL_CMD=sudo pacman -S --noconfirm pacman-contrib
ENABLED=true
