NAME=Apt
EMOJI=🖥️
REQUIRES_CMD=apt
PROBE_ACTIVE_CMD=[[ -d /var/lib/dpkg ]]
PRIORITY=0
CHECK_CMD=apt list --upgradable
UPDATE_CMD=sudo apt update && sudo apt full-upgrade
INSTALL_CMD=sudo apt-get install -y
FLAGS=
FLAGS_AUTO_CONFIRM=-y
FLAGS_INTERACTIVE=
FLAGS_OVERRIDE=-o Dpkg::Options::="--force-overwrite" -f
COLOR_FLAG=
EXCLUDE_FLAG=
EXCLUDE_JOIN=
EXCLUDE_HOLD_CMD=sudo apt-mark hold $PKG
EXCLUDE_UNHOLD_CMD=sudo apt-mark unhold $PKG
CHECK_UPDATES_EXIT_CODE=
CHECK_FILTER_PATTERN=^Listing
CHECK_TIMEOUT_FALLBACK=
ENABLED=true
