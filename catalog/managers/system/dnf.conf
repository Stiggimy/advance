NAME=Dnf
EMOJI=🖥️
REQUIRES_CMD=dnf
PROBE_ACTIVE_CMD=[[ -d /var/lib/dnf || -d /var/lib/rpm ]]
PRIORITY=0
CHECK_CMD=dnf check-update
UPDATE_CMD=sudo dnf upgrade
FLAGS=
FLAGS_AUTO_CONFIRM=--assumeyes
FLAGS_INTERACTIVE=
FLAGS_OVERRIDE=--allowerasing
COLOR_FLAG=
EXCLUDE_FLAG=--exclude=
EXCLUDE_JOIN=,
EXCLUDE_HOLD_CMD=
EXCLUDE_UNHOLD_CMD=
CHECK_UPDATES_EXIT_CODE=100
CHECK_FILTER_PATTERN=
CHECK_TIMEOUT_FALLBACK=
ENABLED=true
