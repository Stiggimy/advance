PROBE_ACTIVE_CMD=fwupdmgr get-devices >/dev/null 2>&1
PRIORITY=0
CHECK_CMD=fwupdmgr get-updates
UPDATE_CMD={ fwupdmgr refresh || [[ $? -eq 2 ]]; } && { fwupdmgr update || [[ $? -eq 2 ]]; }
FLAGS=
FLAGS_AUTO_CONFIRM=--assume-yes
FLAGS_INTERACTIVE=
FLAGS_OVERRIDE=
COLOR_FLAG=
EXCLUDE_FLAG=
EXCLUDE_JOIN=
EXCLUDE_HOLD_CMD=
EXCLUDE_UNHOLD_CMD=
CHECK_UPDATES_EXIT_CODE=
CHECK_FILTER_PATTERN=No updatable devices|Devices with no available firmware updates|• 
CHECK_TIMEOUT_FALLBACK=
ENABLED=true
