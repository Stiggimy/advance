NAME=Snap
EMOJI=📦
REQUIRES_CMD=snap
PROBE_ACTIVE_CMD=snap list >/dev/null 2>&1 || systemctl is-active --quiet snapd.socket 2>/dev/null || systemctl is-active --quiet snapd.service 2>/dev/null
PRIORITY=0
CHECK_CMD=snap refresh --list
UPDATE_CMD=sudo snap refresh
FLAGS=
FLAGS_AUTO_CONFIRM=none
FLAGS_INTERACTIVE=
FLAGS_OVERRIDE=
COLOR_FLAG=
EXCLUDE_FLAG=
EXCLUDE_JOIN=
EXCLUDE_HOLD_CMD=sudo snap refresh --hold $PKG
EXCLUDE_UNHOLD_CMD=sudo snap refresh --unhold $PKG
CHECK_UPDATES_EXIT_CODE=
CHECK_FILTER_PATTERN=
CHECK_TIMEOUT_FALLBACK=
ENABLED=true
