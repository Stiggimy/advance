NAME=PNPM
EMOJI=🌍
REQUIRES_CMD=pnpm
PROBE_ACTIVE_CMD=[[ -d "$HOME/.local/share/pnpm" || -x "$(command -v pnpm 2>/dev/null)" ]]
PRIORITY=10
CHECK_CMD=pnpm outdated -g
UPDATE_CMD=pnpm self-update && pnpm update -g
FLAGS=
FLAGS_AUTO_CONFIRM=none
FLAGS_INTERACTIVE=
FLAGS_OVERRIDE=
COLOR_FLAG=
EXCLUDE_FLAG=
EXCLUDE_JOIN=
EXCLUDE_HOLD_CMD=
EXCLUDE_UNHOLD_CMD=
CHECK_UPDATES_EXIT_CODE=
CHECK_FILTER_PATTERN=
CHECK_TIMEOUT_FALLBACK=
ENABLED=true
