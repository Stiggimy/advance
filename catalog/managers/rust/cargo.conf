NAME=Cargo
EMOJI=🦀
REQUIRES_CMD=cargo
PROBE_ACTIVE_CMD=[[ -d "${CARGO_HOME:-$HOME/.cargo}" ]]
PRIORITY=0
CHECK_CMD=if cargo install-update --help >/dev/null 2>&1; then cargo install-update -l; fi
UPDATE_CMD=if cargo install-update --help >/dev/null 2>&1; then cargo install-update -a; else cargo install cargo-update && cargo install-update -a; fi
FLAGS=
FLAGS_AUTO_CONFIRM=none
FLAGS_INTERACTIVE=
FLAGS_OVERRIDE=
COLOR_FLAG=
EXCLUDE_FLAG=
EXCLUDE_JOIN=
EXCLUDE_HOLD_CMD=
EXCLUDE_UNHOLD_CMD=
CHECK_UPDATES_EXIT_CODE=
CHECK_FILTER_PATTERN=Polling registry|^Package|^[[:space:]]*$|[[:space:]]No[[:space:]]*$
CHECK_TIMEOUT_FALLBACK=
ENABLED=true
